plugins { id 'com.android.application' }
android {
    namespace 'org.opencharge.teslable'
    packaging { jniLibs { useLegacyPackaging true; keepDebugSymbols += ['**/libcloudflared.so'] } }
    compileSdk 35
    ndkVersion '28.2.13676358'
    defaultConfig {
        applicationId 'org.opencharge.teslable'
        minSdk 26
        targetSdk 35
        versionCode 17
        versionName '0.3.12-continuity'
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++23 -fexceptions -frtti'
                abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
                arguments '-DANDROID_STL=c++_shared'
            }
        }
    }
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
    // Use permanent signing in CI; otherwise use normal local debug signing.
    if (System.getenv('TESLA_SIGNING_STORE_FILE') &&
        System.getenv('TESLA_SIGNING_PASSWORD')) {
        signingConfigs {
            teslaPersistent {
                storeFile file(System.getenv('TESLA_SIGNING_STORE_FILE'))
                storePassword System.getenv('TESLA_SIGNING_PASSWORD')
                keyAlias 'tesla-ble-monitor'
                keyPassword System.getenv('TESLA_SIGNING_PASSWORD')
            }
        }
        buildTypes {
            debug {
                signingConfig signingConfigs.teslaPersistent
            }
        }
    }
    buildTypes { release { minifyEnabled false } }
    compileOptions { coreLibraryDesugaringEnabled true; sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation 'org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.2.5'
}

// Pinned executable is a generated build input, not a committed binary or secret.
tasks.register('fetchPinnedCloudflared', Exec) {
    workingDir rootProject.projectDir
    commandLine 'python3', rootProject.file('tools/fetch_cloudflared.py').absolutePath
}
tasks.named('preBuild').configure { dependsOn 'fetchPinnedCloudflared' }
