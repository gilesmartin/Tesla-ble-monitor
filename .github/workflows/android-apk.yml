name: Build Android test APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Android SDK and NDK
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0' 'cmake;3.22.1' 'ndk;28.2.13676358'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore permanent signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.TESLA_KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64" || exit 1
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/tesla-monitor.p12"
          chmod 600 "$RUNNER_TEMP/tesla-monitor.p12"

      - name: Build debug APK
        env:
          TESLA_SIGNING_STORE_FILE: ${{ runner.temp }}/tesla-monitor.p12
          TESLA_SIGNING_PASSWORD: ${{ secrets.TESLA_SIGNING_PASSWORD }}
        run: |
          test -n "$TESLA_SIGNING_PASSWORD" || exit 1
          gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: tesla-ble-monitor-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
